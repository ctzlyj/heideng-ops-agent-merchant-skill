name: Merchant standalone verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --no-cache-dir -r tests/requirements.txt
      - run: python tests/run_offline.py
      - run: python scripts/build_release.py
      - run: python scripts/audit_release.py dist/heideng-ops-agent-merchant-0.1.0.zip
