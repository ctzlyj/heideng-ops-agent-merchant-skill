name: Merchant acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use a canonical runner directory for disposable merchant homes
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'merchant-tests'
          root.mkdir(exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for name in ('TMPDIR', 'TEMP', 'TMP'):
                  print(f'{name}={root}', file=env)
      - name: Install CI dependencies
        run: >-
          python -I -m pip --isolated install --index-url https://pypi.org/simple
          --only-binary=:all: --no-cache-dir -r tests/mature-requirements.txt -r requirements-updates.txt
      - name: Installed merchant journey
        run: python -B tests/run_merchant_journey.py
      - run: python tests/run_usability_offline.py
      - run: python tests/run_mature_offline.py
      - run: python scripts/build_release.py
      - run: python -c "from pathlib import Path; from scripts.audit_release import audit; import json; print(json.dumps(audit(next(Path('dist').glob('heideng-ops-agent-merchant-*.zip')))))"
