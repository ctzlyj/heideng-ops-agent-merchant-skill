name: Merchant acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use a canonical runner directory for disposable merchant homes
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'merchant-tests'
          root.mkdir(exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for name in ('TMPDIR', 'TEMP', 'TMP'):
                  print(f'{name}={root}', file=env)
      - name: Install CI dependencies
        run: >-
          python -I -m pip --isolated install --index-url https://pypi.org/simple
          --only-binary=:all: --no-cache-dir -r tests/mature-requirements.txt -r requirements-updates.txt
      - name: Installed merchant journey
        run: python -B tests/run_merchant_journey.py
      - name: Local Chrome and driver on macOS ARM64
        if: runner.os == 'macOS' && matrix.python == '3.12'
        run: python -B -m tests.smoke_connection_browser --channel chrome
      - name: Observe public HTTPS in JD's pinned ARM64 binary (no shop login)
        if: runner.os == 'macOS' && matrix.python == '3.12'
        shell: bash
        run: |
          set -o pipefail
          python -B tests/probe_macos_official_cli.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Merchant usability from Git source
        run: python -B tests/run_usability_offline.py --source-only
      - name: Offline commerce regressions from Git source
        run: python -B tests/run_mature_offline.py --source-only
